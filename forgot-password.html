<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Super Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <a class="logo" href="index.html">SUPER <span>SHOP</span></a>
        <div class="user-info"><a href="index.html">Back to Login</a></div>
    </header>

    <main class="auth-box">
        <section class="card">
            <h1>Forgot Password</h1>
            <p class="page-subtitle">Enter the email address used for your account.</p>
            <p class="notice">Demo only: this page does not send an email or change a password. Contact the Admin to reset your demo account.</p>
            <div id="forgotMessage" class="message" role="status"></div>

            <form action="#" method="post" onsubmit="return validateForgotPassword();">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error" id="emailError"></span>
                </div>
                <div class="form-buttons">
                    <button class="btn" type="submit">Check Account</button>
                    <button class="btn btn-secondary" type="reset" onclick="clearForgotErrors()">Reset</button>
                </div>
                <p class="auth-links"><a href="index.html">Back to Login</a></p>
            </form>
        </section>
    </main>

    <footer class="footer">&copy; 2026 Super Shop Management System</footer>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
